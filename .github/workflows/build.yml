name: daily-build

on:
  schedule:
    - cron: '30 20 * * *'   # 毎日 05:30 JST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build site
        shell: pwsh
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
        run: ./site/build.ps1

      - name: Commit data cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subsidies.json data/tokyo.json
          if ! git diff --staged --quiet; then
            git commit -m "data: daily update"
            git push
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
